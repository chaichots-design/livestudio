<!doctype html>
<html lang="th" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveStudio ฉากสินค้า AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@500;600&display=swap">
<style>
/* Full-frame "AI product scene" for the OBS clip scene: product photo, name, price, selling
   points, basket number, and the "มี AI ช่วยนำเสนอ" disclosure. LiveStudio (index.html) sets the
   URL hash (JSON, photo as a data URL) on every segment change. No hash = demo.
   Portrait (1080x1920) stacks photo over text; landscape puts them side by side.
   Animations are transform-only (opacity animations looked frozen in OBS captures). */
:root{--u:min(1vw,1vh);--pink:#e2365b;--purple:#b5179e;--green:#1f7a5a;--ink:#18202b;--muted:#5d6876}
html,body{margin:0;height:100%;overflow:hidden;background:#140c1a}
body{font-family:"Kanit","IBM Plex Sans Thai","Leelawadee UI",sans-serif;color:#fff}
.bg{position:absolute;inset:-8%;background:radial-gradient(120% 90% at 20% 10%,#e2365b 0,#7a1060 45%,#1a0d24 100%);filter:saturate(1.1)}
.bg img{width:100%;height:100%;object-fit:cover;filter:blur(calc(var(--u)*5)) brightness(.45) saturate(1.3)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--u)*6);gap:calc(var(--u)*4);box-sizing:border-box}
/* Portrait = the TikTok phone frame: comments and the shop bar cover the bottom ~28%, so keep it empty. */
@media (orientation:portrait){.stage{padding:8vh calc(var(--u)*6) 28vh}.info{flex:none}}
@media (orientation:landscape){.stage{flex-direction:row;align-items:center;padding:calc(var(--u)*7) calc(var(--u)*8)}}
.photo{flex:1.25;min-height:0;display:flex;align-items:center;justify-content:center}
@media (orientation:landscape){.photo{flex:1;height:100%}}
.frame{position:relative;height:100%;max-width:100%;aspect-ratio:1;border-radius:calc(var(--u)*4);overflow:hidden;background:#fff;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*8) rgba(0,0,0,.45)}
@media (orientation:portrait){.frame{height:100%;width:auto}}
.frame img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,-1%)}}
.frame .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--u)*16);
  color:var(--pink);background:linear-gradient(135deg,#fff,#fde7ee)}
.code{position:absolute;left:calc(var(--u)*2.4);top:calc(var(--u)*2.4);font-weight:600;font-size:calc(var(--u)*3.4);background:var(--pink);
  color:#fff;padding:calc(var(--u)*.3) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.4);letter-spacing:.03em}
.info{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.6)}
.tags{display:flex;gap:calc(var(--u)*1.2);flex-wrap:wrap}
.tag{font-family:"IBM Plex Sans Thai",sans-serif;font-weight:500;font-size:calc(var(--u)*2.4);background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.35);padding:calc(var(--u)*.3) calc(var(--u)*1.6);border-radius:999px}
.tag.live{background:var(--pink);border-color:var(--pink)}
.name{font-weight:600;font-size:calc(var(--u)*5.6);line-height:1.2;margin:0}
.price-row{display:flex;align-items:baseline;gap:calc(var(--u)*2.4);flex-wrap:wrap}
.price{font-weight:700;font-size:calc(var(--u)*10);line-height:1;color:#fff;text-shadow:0 calc(var(--u)*.5) calc(var(--u)*2) rgba(0,0,0,.35)}
.promo{font-family:"IBM Plex Sans Thai",sans-serif;font-weight:600;font-size:calc(var(--u)*3.2);background:#ffd84d;color:#3a2500;
  padding:calc(var(--u)*.4) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.4)}
.pts{position:relative;height:calc(var(--u)*5.2);overflow:hidden}
.pt{position:absolute;left:0;right:0;font-family:"IBM Plex Sans Thai",sans-serif;font-weight:500;font-size:calc(var(--u)*3.3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;transform:translateY(120%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pt.on{transform:none}.pt.out{transform:translateY(-120%)}
.pt::before{content:"✓ ";color:#7ef0b8}
.cta{align-self:flex-start;font-weight:600;font-size:calc(var(--u)*3.8);background:#fff;color:var(--purple);
  padding:calc(var(--u)*.9) calc(var(--u)*3);border-radius:999px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);text-align:center;padding:calc(var(--u)*6)}
.idle b{font-size:calc(var(--u)*7);font-weight:600}
.idle span{font-family:"IBM Plex Sans Thai",sans-serif;font-size:calc(var(--u)*3.4);opacity:.9}
.in{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{transform:translateY(calc(var(--u)*6)) scale(.97)}to{transform:none}}
.demo{position:fixed;right:8px;bottom:8px;font:12px system-ui;color:#fff;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px}
.tag.low{background:#ffd84d;border-color:#ffd84d;color:#3a2500}.tag.out{background:#fff;border-color:#fff;color:var(--pink)}
/* message sits over the top of the product photo so the price and the basket line stay visible */
.msg{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:10vh;display:flex;justify-content:center;z-index:5}
@media (orientation:landscape){.msg{top:calc(var(--u)*4)}}
.mbox{max-width:calc(var(--u)*84);background:rgba(255,255,255,.96);color:#18202b;border-radius:calc(var(--u)*2.6);padding:calc(var(--u)*2) calc(var(--u)*3);
  font-weight:500;font-size:calc(var(--u)*3.6);line-height:1.35;box-shadow:0 calc(var(--u)*1) calc(var(--u)*5) rgba(0,0,0,.4);border-left:calc(var(--u)*1.2) solid var(--pink)}
.mbox.faq{border-left-color:var(--green)}.mbox.thx{border-left-color:#ffd84d}
.mbox .q{display:block;font-family:"IBM Plex Sans Thai",sans-serif;font-size:calc(var(--u)*2.5);color:#5d6876;margin-bottom:calc(var(--u)*.4)}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:translateY(calc(var(--u)*-6));opacity:0}to{transform:none;opacity:1}}
/* AI helper mascot (field ms {k: cat|bunny|bear, n: name, sp: 1 while the AI voice speaks}). Product segments
   only (the app never sends ms in live-talk time), a small corner well under half the screen, always
   labelled "ผู้ช่วย AI". A cartoon on purpose: nobody mistakes it for a real person. Transform-only animation. */
.mascot{position:absolute;right:calc(var(--u)*4);bottom:29vh;z-index:4;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);pointer-events:none}
.mascot svg{height:17vh;width:auto;overflow:visible;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.35))}
@media (orientation:landscape){.mascot{bottom:calc(var(--u)*4)}.mascot svg{height:30vh}}
@media (orientation:portrait){body.has-ms .info{padding-right:15vh}}
/* avatar size z: s (default) / m / l, side sd: r (default) / l. Even "l" stays well under half the frame
   (portrait about 22vh x 26vh of a 56vh x 100vh canvas, landscape about 37vh x 44vh of 178vh x 100vh). */
.mascot.z-m svg{height:21vh}.mascot.z-l svg{height:26vh}
@media (orientation:landscape){.mascot.z-m svg{height:37vh}.mascot.z-l svg{height:44vh}}
@media (orientation:portrait){body.ms-m .info{padding-right:18vh}body.ms-l .info{padding-right:22vh}
  body.ms-left .info{padding-right:0!important;padding-left:15vh}body.ms-left.ms-m .info{padding-left:18vh}body.ms-left.ms-l .info{padding-left:22vh}}
@media (orientation:landscape){body.has-ms.ms-m .info{padding-bottom:28vh}body.has-ms.ms-l .info{padding-bottom:36vh}}
.mascot.sd-l{right:auto;left:calc(var(--u)*4)}
.mascot.sd-l .arm{transform-origin:80% 90%}
.mlabel{font-family:"IBM Plex Sans Thai",sans-serif;font-weight:600;font-size:calc(var(--u)*2.3);background:rgba(20,12,26,.78);border:1px solid rgba(255,255,255,.4);
  padding:calc(var(--u)*.3) calc(var(--u)*1.4);border-radius:999px;white-space:nowrap}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-1.2))}}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot .mo{transform-box:fill-box;transform-origin:50% 20%;transform:scaleY(0)}
.mascot.sp .mo{animation:talk .26s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.mascot .arm{transform-box:fill-box;transform-origin:20% 90%}
.mascot.sp .arm{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
</style>
</head>
<body>
<div id="root"></div>
<div class="msg" id="msg"></div>
<div class="mascot" id="mascot" hidden></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const baht=n=>"฿"+Number(n||0).toLocaleString("th-TH");
const DEMO={s:"prod",c:"A1",n:"เซรั่มวิตามินซี 30ml",p:290,pr:"ซื้อ 2 ขวดเหลือ 499",b:1,pts:["ผิวดูกระจ่างใสใน 2 สัปดาห์","เนื้อบางซึมไว ไม่เหนียว","ใช้ได้ทั้งเช้าและเย็น"],img:""};
let lastKey="",ptTimer=null;
function data(){const h=location.hash.slice(1);if(!h)return Object.assign({demo:true},DEMO);try{return JSON.parse(decodeURIComponent(h))}catch(e){return{s:"idle"}}}
function view(d){
  if(d.s!=="prod"){const t=d.s==="close"?["ขอบคุณที่อยู่ด้วยกัน",d.af?"ยังกดตะกร้าสั่งได้ตามเลขที่บอก":"โปรราคาไลฟ์หมดเมื่อปิดไลฟ์"]:d.s==="idle"?["ไลฟ์กำลังจะเริ่ม","กดติดตามไว้ ไม่พลาดโปรในไลฟ์"]:["ช่วงคุยสด","ถามมาได้เลย ตอบสดทุกคำถาม"];
    return`<div class="bg"></div><div class="idle in"><span class="tag live">● LIVE</span><b>${t[0]}</b><span>${t[1]}</span></div>`}
  const img=d.img?`<img src="${esc(d.img)}" alt="">`:"";
  const pts=(d.pts||[]).filter(Boolean).slice(0,5);
  return`<div class="bg">${img}</div><div class="stage in">
    <div class="photo"><div class="frame">${img||`<div class="ph">${esc(d.c)}</div>`}<span class="code">${esc(d.c)}</span></div></div>
    <div class="info">
      <div class="tags"><span class="tag live">● LIVE</span><span class="tag">มี AI ช่วยนำเสนอ</span>${d.st!=null?`<span class="tag ${d.st>0?"low":"out"}">${d.st>0?`เหลือ ${esc(d.st)} ชิ้น`:"หมดแล้ว"}</span>`:""}${d.sh?`<span class="tag">${esc(d.sh)}</span>`:""}</div>
      <h1 class="name">${esc(d.n)}</h1>
      <div class="price-row"><span class="price">${baht(d.p)}</span>${d.pr?`<span class="promo">${esc(d.pr)}</span>`:""}</div>
      ${pts.length?`<div class="pts">${pts.map((p,i)=>`<div class="pt${i===0?" on":""}">${esc(p)}</div>`).join("")}</div>`:""}
      <div class="cta">${d.st===0?"สินค้าหมดแล้ว ขอบคุณที่สนใจค่ะ":d.af?`กดตะกร้า #${esc(d.b)} สั่งซื้อได้เลย`:d.b?`กดตะกร้า #${esc(d.b)} หรือพิมพ์ CF ${esc(d.c)}`:`พิมพ์ CF ${esc(d.c)} ในคอมเมนต์`}</div>
    </div></div>`}
function cyclePoints(){clearInterval(ptTimer);const els=[...document.querySelectorAll(".pt")];if(els.length<2)return;let i=0;
  ptTimer=setInterval(()=>{const a=els[i];i=(i+1)%els.length;const b=els[i];
    a.classList.remove("on");a.classList.add("out");b.classList.remove("out");void b.offsetWidth;b.classList.add("on");
    setTimeout(()=>{a.style.transition="none";a.classList.remove("out");void a.offsetWidth;a.style.transition=""},700)},4000)}
const MS={cat:{f:"#ffb36b",d:"#d9772e",i:"#ffd2df"},bunny:{f:"#fbf7fb",d:"#c9b8cf",i:"#ffbcd2"},bear:{f:"#c08a62",d:"#86552f",i:"#f0cfae"},
  host_f:{f:"#f6cfae",d:"#b9805c",i:"#ffb3c4",h:"#3b2430",s:"#e2365b"},host_m:{f:"#efc3a0",d:"#a8714e",i:"#f5b0a8",h:"#2a2230",s:"#2f6fdd"}};
/* cartoon presenter (flat drawing, big eyes, headset mic): clearly a drawing, not a realistic person */
function hostSVG(k){const c=MS[k],S=`stroke="${c.d}" stroke-width="4"`,f=k==="host_f";
  return `<svg viewBox="0 0 210 250" role="img" aria-label="อวตารพิธีกร AI">
   <g class="arm"><path d="M150 176 Q178 150 182 118" stroke="${c.s}" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="183" cy="112" r="12" fill="${c.f}" ${S}/></g>
   ${f?`<path d="M38 112 Q34 40 100 36 Q166 40 162 112 L166 176 Q100 196 34 176 Z" fill="${c.h}"/>`:""}
   <path d="M40 250 L44 206 Q50 172 100 168 Q150 172 156 206 L160 250 Z" fill="${c.s}" ${S}/>
   <path d="M84 170 L100 192 L116 170" fill="#fff" stroke="${c.d}" stroke-width="3"/>
   <rect x="80" y="206" width="40" height="24" rx="6" fill="#fff"/><text x="100" y="225" text-anchor="middle" font-family="Kanit,sans-serif" font-weight="700" font-size="18" fill="${c.s}">AI</text>
   <path d="M60 196 Q40 214 46 246" stroke="${c.s}" stroke-width="20" fill="none" stroke-linecap="round"/>
   <rect x="90" y="148" width="20" height="24" rx="8" fill="${c.f}"/>
   <ellipse cx="100" cy="102" rx="54" ry="58" fill="${c.f}" ${S}/>
   ${f?`<path d="M46 98 Q50 46 100 44 Q150 46 154 98 Q132 70 104 66 Q84 82 46 98 Z" fill="${c.h}"/>`
      :`<path d="M46 96 Q44 44 100 40 Q158 44 154 96 Q150 70 128 62 Q104 76 72 66 Q52 74 46 96 Z" fill="${c.h}"/>`}
   <path d="M44 104 Q44 52 100 50 Q156 52 156 104" stroke="#2a1d2e" stroke-width="5" fill="none"/>
   <rect x="148" y="96" width="14" height="24" rx="6" fill="#2a1d2e"/><path d="M152 118 Q146 140 116 138" stroke="#2a1d2e" stroke-width="4" fill="none"/><circle cx="114" cy="138" r="5" fill="#2a1d2e"/>
   <ellipse cx="68" cy="122" rx="10" ry="6" fill="${c.i}"/><ellipse cx="132" cy="122" rx="10" ry="6" fill="${c.i}"/>
   <path d="M66 88 Q78 82 88 88" stroke="${c.h}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M112 88 Q122 82 134 88" stroke="${c.h}" stroke-width="4" fill="none" stroke-linecap="round"/>
   <g class="eye"><ellipse cx="78" cy="104" rx="8" ry="11" fill="#2a1d2e"/><circle cx="81" cy="99" r="3" fill="#fff"/></g>
   <g class="eye"><ellipse cx="122" cy="104" rx="8" ry="11" fill="#2a1d2e"/><circle cx="125" cy="99" r="3" fill="#fff"/></g>
   <path d="M86 128 Q100 138 114 128" stroke="#2a1d2e" stroke-width="4" fill="none" stroke-linecap="round"/>
   <ellipse class="mo" cx="100" cy="135" rx="10" ry="9" fill="#7a1f3a"/>
  </svg>`}
function mascotSVG(k){if(k==="host_f"||k==="host_m")return hostSVG(k);const c=MS[k]||MS.cat,S=`stroke="${c.d}" stroke-width="4"`;
  const ears=k==="bunny"?`<ellipse cx="72" cy="38" rx="15" ry="42" fill="${c.f}" ${S} transform="rotate(-10 72 38)"/><ellipse cx="72" cy="40" rx="7" ry="30" fill="${c.i}" transform="rotate(-10 72 40)"/><ellipse cx="128" cy="38" rx="15" ry="42" fill="${c.f}" ${S} transform="rotate(10 128 38)"/><ellipse cx="128" cy="40" rx="7" ry="30" fill="${c.i}" transform="rotate(10 128 40)"/>`
   :k==="bear"?`<circle cx="50" cy="56" r="22" fill="${c.f}" ${S}/><circle cx="50" cy="56" r="11" fill="${c.i}"/><circle cx="150" cy="56" r="22" fill="${c.f}" ${S}/><circle cx="150" cy="56" r="11" fill="${c.i}"/>`
   :`<path d="M42 78 L52 20 L92 52 Z" fill="${c.f}" ${S} stroke-linejoin="round"/><path d="M54 62 L58 34 L80 52 Z" fill="${c.i}"/><path d="M158 78 L148 20 L108 52 Z" fill="${c.f}" ${S} stroke-linejoin="round"/><path d="M146 62 L142 34 L120 52 Z" fill="${c.i}"/>`;
  const muzzle=k==="bear"?`<ellipse cx="100" cy="124" rx="26" ry="19" fill="${c.i}"/>`:"";
  const whisk=k==="cat"?`<g stroke="${c.d}" stroke-width="3" stroke-linecap="round"><path d="M56 118 L30 112"/><path d="M56 126 L30 128"/><path d="M144 118 L170 112"/><path d="M144 126 L170 128"/></g>`:"";
  return `<svg viewBox="0 0 210 250" role="img" aria-label="มาสคอตผู้ช่วย AI">
   <g class="arm"><ellipse cx="172" cy="178" rx="15" ry="30" fill="${c.f}" ${S} transform="rotate(30 172 178)"/></g>
   <ellipse cx="100" cy="206" rx="62" ry="44" fill="${c.f}" ${S}/>
   <path d="M62 196 Q100 180 138 196 L132 240 Q100 250 68 240 Z" fill="#e2365b"/>
   <text x="100" y="228" text-anchor="middle" font-family="Kanit,sans-serif" font-weight="700" font-size="24" fill="#fff">AI</text>
   <ellipse cx="34" cy="200" rx="14" ry="26" fill="${c.f}" ${S} transform="rotate(-18 34 200)"/>
   ${ears}
   <circle cx="100" cy="104" r="66" fill="${c.f}" ${S}/>
   ${muzzle}${whisk}
   <ellipse cx="62" cy="126" rx="11" ry="7" fill="${c.i}"/><ellipse cx="138" cy="126" rx="11" ry="7" fill="${c.i}"/>
   <g class="eye"><ellipse cx="76" cy="98" rx="9" ry="12" fill="#2a1d2e"/><circle cx="79" cy="93" r="3.2" fill="#fff"/></g>
   <g class="eye"><ellipse cx="124" cy="98" rx="9" ry="12" fill="#2a1d2e"/><circle cx="127" cy="93" r="3.2" fill="#fff"/></g>
   <ellipse cx="100" cy="116" rx="6" ry="4.5" fill="#5a2a3a"/>
   <path d="M88 126 Q100 136 112 126" stroke="#2a1d2e" stroke-width="4" fill="none" stroke-linecap="round"/>
   <ellipse class="mo" cx="100" cy="134" rx="11" ry="10" fill="#7a1f3a"/>
  </svg>`}
let lastMs="";
function renderMascot(ms){const el=document.getElementById("mascot"),key=JSON.stringify(ms||null);if(key===lastMs)return;
  const prev=lastMs?JSON.parse(lastMs):null,same=prev&&ms&&prev.k===ms.k&&prev.n===ms.n;lastMs=key;
  const z=ms&&(ms.z==="m"||ms.z==="l")?ms.z:"s",left=!!(ms&&ms.sd==="l");
  document.body.classList.toggle("has-ms",!!ms);document.body.classList.toggle("ms-m",!!ms&&z==="m");document.body.classList.toggle("ms-l",!!ms&&z==="l");document.body.classList.toggle("ms-left",!!ms&&left);
  el.classList.toggle("z-m",z==="m");el.classList.toggle("z-l",z==="l");el.classList.toggle("sd-l",left);
  el.hidden=!ms;if(!ms){el.innerHTML="";return}
  if(!same)el.innerHTML=mascotSVG(MS[ms.k]?ms.k:"cat")+`<div class="mlabel">🤖 ${esc(String(ms.n||"น้องไลฟ์").slice(0,16))} · ผู้ช่วย AI</div>`;
  el.classList.toggle("sp",!!ms.sp)}
let lastMsg="";
function msgHTML(m){if(!m||!m.t)return"";const k=m.k==="faq"?"faq":m.k==="thx"?"thx":"note";
  return`<div class="mbox ${k} pop">${m.q?`<span class="q">ถาม: ${esc(m.q)}</span>`:""}${k==="thx"?"🎉 ":""}${esc(m.t)}</div>`}
function render(){const d=data(),m=d.m||null,ms=d.s==="prod"&&d.ms&&typeof d.ms==="object"?d.ms:null;delete d.m;delete d.ms;renderMascot(ms);const mk=JSON.stringify(m);
  if(mk!==lastMsg){lastMsg=mk;document.getElementById("msg").innerHTML=msgHTML(m)}
  const key=JSON.stringify(d);if(key===lastKey)return;lastKey=key;
  document.getElementById("root").innerHTML=view(d)+(d.demo?'<div class="demo">ตัวอย่าง: ใน OBS ฉากนี้จะเปลี่ยนตามสินค้าที่กำลังขายเอง</div>':"");cyclePoints()}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
